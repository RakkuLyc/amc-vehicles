modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# keeps the mod's lava potency out of IV's config file (ConfigSystemMixin)
[[mixins]]
config="amcvehicles.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Immersive Vehicles (mod id "mts") and its Official Content Pack (the Mercedes merc230)
[[dependencies.${mod_id}]]
    modId="mts"
    type="required"
    # only the 24 series: FuelPumps reaches two protected members of IV by reflection (the user's choice, 2026-11-19)
    versionRange="[24.0.0,25)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="mtsofficialpack"
    type="required"
    versionRange="[29,)"
    ordering="AFTER"
    side="BOTH"

# Abandoned Modern City: the structures and their plan (where each one stands, turned how)
[[dependencies.${mod_id}]]
    modId="abandonedmoderncity"
    type="required"
    versionRange="[0.1.0,)"
    ordering="AFTER"
    side="BOTH"

# Official Automobile Pack: the Cagouille, Camaro, Escargot, Highwayman and Station Wagon
[[dependencies.${mod_id}]]
    modId="oamp"
    type="required"
    versionRange="[3,)"
    ordering="AFTER"
    side="BOTH"
